version: '3.8'

services:
  budget-manager:
    build: .
    container_name: budget-manager
    ports:
      - "80:80"
    volumes:
      - ./data:/app/data
    environment:
      - FLASK_ENV=production
      - DATABASE_PATH=/app/data/budget.db
    restart: unless-stopped

volumes:
  budget-data:
    driver: local